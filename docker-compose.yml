services:
  backend:
    build: .
    container_name: corrective-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Bind mount (not a Docker-managed named volume) so the index already
      # built locally via `python -m data_pipeline.build_index` is used
      # directly, and survives container rebuilds/restarts either way.
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
